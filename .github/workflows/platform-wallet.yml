name: Platform wallet boundaries
on:
  pull_request:
    paths:
      [
        'src/platform/**',
        'src/token-demo/**',
        'plataforma.html',
        'tests/wallet*',
        'tests/platform.browser.mjs',
        'scripts/check-platform-wallet.mjs',
        'scripts/prepare-platform-preview.mjs',
        'vite.platform.config.mjs',
        'package*.json',
        '.github/workflows/platform-wallet.yml',
      ]
permissions:
  contents: read
jobs:
  consultation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/wallet-session.test.mjs tests/token-demo.test.mjs tests/token-catalog.test.mjs
      - run: npm run build:platform && npm run verify:platform-wallet
      - run: npx puppeteer browsers install chrome
      - name: Browser regression
        run: |
          npm exec vite preview -- --config vite.platform.config.mjs > /tmp/platform.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4196/plataforma.html >/dev/null && break
            sleep 1
          done
          node tests/platform.browser.mjs
          node tests/wallet.browser.mjs
